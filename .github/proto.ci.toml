# The config CI runs against.
#
# The password is not here: `password_env` points at the variable the
# workflow sets, which is the same one psql reads. Nothing in this file
# is a secret, and nothing in it needs to be.

default_db = "ci"

[databases.ci]
host = "localhost"
port = 5432
name = "proto_ci"
user = "postgres"
password_env = "PGPASSWORD"
