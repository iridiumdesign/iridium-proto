# proto configuration
#
# Read from $PROTO_CONFIG, else $XDG_CONFIG_HOME/proto/proto.toml, else
# ~/.config/proto/proto.toml. Unknown keys in a [databases.*] table are
# ignored, so PROTO_CONFIG can point straight at a config written for
# another tool.

# Target used when --db is omitted. Unnecessary when exactly one database
# is defined below — that one is the default.
default_db = "dev"

[databases.dev]
host = "localhost"
port = 5432
name = "shop"
user = "shop"
password = "devpass"
# password_file = "/run/secrets/shop_db_pass"
# password_env  = "SHOP_DB_PASS"
# schema = "shop"            # default schema for an unqualified table

[databases.staging]
url = "postgres://shop@staging.example.com/shop"

[generate]
derives = ["sqlx::FromRow", "Debug", "Clone", "Serialize", "Deserialize"]
enum_derives = [
    "sqlx::Type", "Debug", "Clone", "Copy",
    "PartialEq", "Eq", "Serialize", "Deserialize",
]
input_derives = ["Debug", "Clone", "Serialize", "Deserialize"]
pyo3_feature = "python"
default_schema = "public"
exclude_tables = ["_sqlx_migrations"]
exclude_schemas = ["information_schema", "pg_catalog", "pg_toast"]

# Where `--sql server` writes its migrations, and what it calls them.
# --migrations-dir beats the directory for a run. The name is a pattern:
# {version} is YYYYMMDDNNN, {date} and {seq} are its halves, {slug} is
# <schema>_<table>_crud, {schema} and {table} are also available, and
# {tag} is whatever migration_tag or --migration-tag says. Anything else
# is written as given, so a project that stamps a target version on its
# migrations can put it wherever the convention wants.
# migrations_dir = "migrations"
# migration_name = "{version}_{slug}.sql"
# migration_name = "{version}_{tag}_{slug}.sql"
# migration_tag = "v1.4"

# Postgres type name -> Rust path. Overrides the built-in map, and is the
# escape hatch for types proto does not know.
[generate.types]
# money = "rust_decimal::Decimal"
# geometry = "geo_types::Geometry<f64>"
